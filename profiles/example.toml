# Example keymap profile. Copy it to
#   ~/.config/droidloom/keymaps/<android.package.name>.toml
# and edit. The file is read each time the game window gains focus.
#
# Positions are fractions of the game window: x from 0.0 (left) to 1.0
# (right), y from 0.0 (top) to 1.0 (bottom).

package = "com.example.game"

# Optional: this key switches mapping on and off, and gives the mouse back.
toggle_key = "F8"

# Four keys steer one virtual joystick touch.
[wheel]
center = [0.18, 0.72]   # where the touch rests
radius = [0.08, 0.14]   # how far a full push moves it (width, height)
up = "W"
down = "S"
left = "A"
right = "D"

# Mouse-look: with this section the pointer is locked while you play, and
# mouse movement drags one touch around a region of the screen.
[look]
anchor = [0.70, 0.45]   # where the look touch starts
region = [0.20, 0.30]   # how far it may travel before it restarts
sensitivity = 1.0       # optional, default 1.0

# Hold a key to put a touch down at a point and steer it with the mouse,
# for aimed skills or a view mode. Release the key to lift it.
[[aim]]
key = "Q"
anchor = [0.90, 0.70]   # the skill button
region = [0.10, 0.15]
cancel_key = "Space"    # optional: abandons the aim ...
cancel_at = [0.80, 0.20] # ... by moving the touch here before lifting it
stop_wheel = false      # optional: lift the joystick first

# One key, one tap.
[[tap]]
key = "R"
x = 0.82
y = 0.64

# Mouse buttons work too (MouseLeft, MouseRight, MouseMiddle, ...).
[[tap]]
key = "MouseLeft"
x = 0.88
y = 0.80

# One key touching several points at once (up to 4).
[[tap]]
key = "T"
points = [[0.10, 0.20], [0.30, 0.40]]
